name: mbudget
description: "A responsive, multi-platform personal budget management application."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.1.2

  # Local SQLite Persistence (Mobile + Desktop FFI)
  sqflite: ^2.3.2
  sqflite_common_ffi: ^2.3.2+1
  path_provider: ^2.1.2
  path: ^1.9.0

  # Charts & Graphical Visualizations
  fl_chart: ^0.68.0

  # Google Drive Cloud Sync & OAuth 2.0
  google_sign_in: ^6.2.1
  googleapis: ^13.1.0
  http: ^1.2.1
  crypto: ^3.0.3

  # UI & Responsive Design
  intl: ^0.19.0
  lucide_icons: ^0.354.0
  file_picker: ^8.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
